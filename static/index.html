<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DamageCounter</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <h1>DamageCounter</h1>
      <span class="sub">Divinity: Original Sin 2 &middot;
        <a class="backlink" :href="fightsHref">fights</a> &middot;
        <a class="backlink" href="/settings">settings</a></span>
    </div>

    <div class="runpick" v-if="runs.length" title="View a previous run">
      <select v-model="selectedRun" @change="runChanged">
        <option value="">Live</option>
        <option v-for="r in runs" :key="r.run" :value="r.run">{{ runLabel(r) }}</option>
      </select>
    </div>

    <dc-number-toggle></dc-number-toggle>

    <div class="status" :class="statusClass">
      <span class="dot"></span>
      <span>{{ statusText }}</span>
    </div>
  </header>

  <main v-if="players.length">

    <section class="cards">
      <dc-player-card
        v-for="p in sorted"
        :key="p.guid"
        :name="p.name"
        :rank="rankOf(p)"
        :damage="Number(p.stats.DamageDone) || 0"
        :share-pct="share(p)"
        :summon-pct="summonWidth(p)"
        :summon-title="'from summons: ' + fmt(p.stats.SummonDamageDone)"
        :leader="p.guid === leaderGuid"
        clickable
        hideable
        :fields="cardFields(p)"
        @select="goSpells(p)"
        @hide="hideCharacter(p)"></dc-player-card>
    </section>

    <div class="toast" v-if="toast">
      {{ toast }} <a href="/settings">Settings</a>
    </div>

    <dc-stat-table :players="sorted"></dc-stat-table>


  </main>

  <main v-else class="empty">
    <div class="empty-box">
      <h2>{{ emptyTitle }}</h2>
      <p v-html="emptyHint"></p>
      <code v-if="path">{{ path }}</code>
    </div>
  </main>

  <footer>
    <span v-if="lastUpdate">updated {{ agoText }}</span>
    <span class="muted">polling every {{ intervalMs / 1000 }}s &middot; {{ players.length }} characters</span>
  </footer>

</div>

<script src="/static/rows.js"></script>
<script src="/static/components.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
